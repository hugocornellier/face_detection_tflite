name: face_detection_tflite
description: "Advanced face & landmark detection, embedding and segmentation using on-device LiteRT (formerly TensorFlow Lite) models."
version: 6.9.0

repository: https://github.com/hugocornellier/face_detection_tflite
homepage: https://github.com/hugocornellier/face_detection_tflite

topics:
  - litert
  - tflite
  - face-detection
  - computer-vision
  - on-device-ml

environment:
  sdk: ">=3.10.0 <4.0.0"
  # flutter_test in Flutter 3.44 and earlier pins meta 1.18.0, which cannot
  # coexist with dartcv4 2.3.1 (meta ^1.19.0). 3.47.5 is the validated floor.
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  opencv_dart: ^2.2.2
  # Direct constraint so resolution can never fall back to a dartcv4 whose iOS
  # CMake hook hardcodes a 12.0 deployment target (rejected by Xcode 27).
  # No Dart source imports it; it is a compatibility floor only.
  dartcv4: ^2.3.1
  # dartcv4 2.3.1's link hook uses the hooks 2.x LinkInput API but still
  # declares hooks >=1.0.0, so a lockfile holding hooks 1.x fails every
  # profile and release build. Same compatibility-floor role as dartcv4.
  hooks: ^2.0.0
  flutter_litert: ^3.9.1
  web: ^1.1.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/face_detection_back.tflite
    - assets/models/face_detection_front.tflite
    - assets/models/face_detection_short_range.tflite
    - assets/models/face_detection_full_range.tflite
    - assets/models/face_detection_full_range_sparse.tflite
    - assets/models/face_landmark.tflite
    - assets/models/iris_landmark.tflite
    - assets/models/face_blendshapes.tflite
    - assets/models/mobilefacenet.tflite
    - assets/models/selfie_multiclass.tflite
    - assets/models/selfie_segmenter.tflite
    - assets/models/selfie_segmenter_landscape.tflite

  plugin:
    platforms:
      ios:
        dartPluginClass: FaceDetectionTfliteDart
      android:
        dartPluginClass: FaceDetectionTfliteDart
      macos:
        dartPluginClass: FaceDetectionTfliteDart
      windows:
        pluginClass: FaceDetectionTflitePlugin
      linux:
        pluginClass: FaceDetectionTflitePlugin
      web:
        pluginClass: FaceDetectionTfliteWeb
        fileName: face_detection_web.dart
